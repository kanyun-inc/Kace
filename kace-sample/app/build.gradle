plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.kanyun.kace'
}

android {
    compileSdk = vgoCompileSdkVersion.toInteger()

    namespace "com.kanyun.kace.sample.demo"

    defaultConfig {
        applicationId = "com.kanyun.kace.sample"
        minSdk = vgoMinSdkVersion.toInteger()
        targetSdk = vgoTargetSdkVersion.toInteger()
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        viewBinding = true
    }

    flavorDimensions 'api', 'mode'

    productFlavors {
        demo {
            dimension = "mode"
        }

        full {
            dimension = "mode"
        }

        minApi23 {
            dimension = "api"
            minSdk = 23
            versionCode = 20000 + android.defaultConfig.versionCode
            versionNameSuffix = "-minApi23"
        }

        minApi21 {
            dimension = "api"
            minSdk = 21
            versionCode = 10000 + android.defaultConfig.versionCode
            versionNameSuffix = "-minApi21"
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.7.0"
    implementation "androidx.appcompat:appcompat:1.4.1"
    implementation "com.google.android.material:material:1.5.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.3"
    implementation "androidx.navigation:navigation-fragment-ktx:2.4.1"
    implementation "androidx.navigation:navigation-ui-ktx:2.4.1"

    // custom deps below
    implementation project(":sample-lib")
}

kace {
    customVariant = [debug: [file("src/debug/res000").absolutePath]]
    customVariant {
        if (it.buildType.name.contains("debug")) {
            return [
                "debug": [
                    file("src/debug/res1").absolutePath,
                    file("src/debug/res2").absolutePath
                ]
            ]
        } else if (it.buildType.name.contains("release")) {
            return [
                "release": [
                    file("src/release/res1").absolutePath,
                    file("src/release/res2").absolutePath
                ]
            ]
        } else {
            return [:]
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
    }
}
